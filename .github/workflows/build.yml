name: build

on:
  # DERIVED, not hand-typed: the version to package is the newest charly RELEASE,
  # and the daily schedule is what keeps this repo from silently lagging the
  # toolchain (it lagged from 2026-10-06 to 2026-11-22, so every image that
  # installed `charly` from here carried packages built by a pre-sdk#397 sdk whose
  # variant family still declared a mutual Replaces — `pacman -Syu` then picked
  # both charly-full and charly-minimal and refused: opencharly/layer-charly#23).
  # The inputs stay for a deliberate backfill; leaving them empty means "the newest
  # release", which is what the schedule uses.
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package; EMPTY = the newest charly release'
        required: false
      charly_lib_version:
        description: 'charly-lib release TAG to fetch the shared host from; EMPTY = the newest'
        required: false
      force:
        description: 'republish an ALREADY-published version as a new pkgrel (a packaging repair, e.g. layer-charly#23)'
        required: false
        default: 'false'
      pkgrel:
        description: 'the pkgrel the force republish produces; required when force is true'
        required: false
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      lib: ${{ steps.pick.outputs.lib }}
      skip: ${{ steps.pick.outputs.skip }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_VERSION: ${{ inputs.version }}
          WANT_LIB: ${{ inputs.charly_lib_version }}
          FORCE: ${{ inputs.force }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          if [ -n "${WANT_VERSION:-}" ]; then
            version="$WANT_VERSION"
          else
            version="$(gh release list --repo opencharly/charly --limit 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')"
          fi
          if [ -n "${WANT_LIB:-}" ]; then
            lib="$WANT_LIB"
          else
            lib="$(gh release list --repo opencharly/charly-lib --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          # Idempotent: nothing to do when the published repo already serves this
          # release. The check reads the SERVED database, so a run that published
          # but crashed before recording state still converges.
          skip=false
          if curl -fsSL https://opencharly.github.io/charly-arch/amd64/charly.db.tar.zst \
               | zstd -dc | tar -t 2>/dev/null | grep -qx "charly-${version}-1/"; then
            skip=true
          fi
          # A REPAIR of an already-published version is a new pkgrel, never a rewritten -1
          # (opencharly/sdk#618/#620): the artifact changed while the upstream version did not,
          # and a client that already holds -1 would never see it. The force input says so
          # explicitly; it is how layer-charly#23's corrected metadata is published.
          release=""
          if [ "${FORCE:-false}" = "true" ]; then
            release="${PKGREL:?force=true needs an explicit pkgrel}"
            skip=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "resolved charly v$version, charly-lib $lib, already published: $skip"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ needs.resolve.outputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          for f in bin/charly-linux-*; do
            mv "$f" "bin/charly-${f#bin/charly-linux-}"
          done
          gh release download v${{ needs.resolve.outputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          # The welded plugins no longer ship as per-plugin binaries: the shared
          # charly-lib host serves them all (opencharly/sdk#258 packagekit hard
          # cutover). Its host + .providers manifests are fetched next.

      - name: Download the charly-lib shared plugin host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p plugins/amd64 plugins/arm64 .charly-lib
          gh release download "${{ needs.resolve.outputs.lib }}" --repo opencharly/charly-lib \
            --pattern 'charly-lib-linux-amd64' \
            --pattern 'charly-lib-linux-arm64' \
            --pattern '*.providers' --dir .charly-lib --clobber
          for arch in amd64 arm64; do
            # The host binary (downloaded non-executable) + one plugin-<word>
            # symlink per welded plugin + its .providers manifest — the ONE
            # layout packagekit accepts.
            install -m0755 ".charly-lib/charly-lib-linux-$arch" "plugins/$arch/charly-lib"
            for f in .charly-lib/*.providers; do
              n=$(basename "$f" .providers)
              cp "$f" "plugins/$arch/$n.providers"
              ln -sf charly-lib "plugins/$arch/$n"
            done
          done
          ls -l plugins/amd64

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          sudo mkdir -p /usr/lib/charly/plugins
          # Shared host once + plugin-<word> symlinks (the loader contract is
          # unchanged: a .providers manifest beside an executable named plugin-<word>).
          sudo install -Dm755 plugins/amd64/charly-lib /usr/lib/charly/plugins/charly-lib
          for f in plugins/amd64/*.providers; do
            n=$(basename "$f" .providers)
            sudo install -Dm644 "$f" "/usr/lib/charly/plugins/$n.providers"
            sudo ln -sf charly-lib "/usr/lib/charly/plugins/$n"
          done
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          sudo install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          sudo install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key.gpg
          chmod 600 key.gpg

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ needs.resolve.outputs.version }} \
                ${{ needs.resolve.outputs.release != '' && format('--release {0}', needs.resolve.outputs.release) || '' }} \
                --arch $arch \
                --variant $variant \
                --formats archlinux \
                --out repo/$arch
            done
          done

      - name: Assemble + sign the pacman database
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws:rw" \
            -e GPG_PASSPHRASE="${{ secrets.GPG_PASSPHRASE }}" \
            archlinux:latest bash -c '
            set -e
            export GNUPGHOME=/tmp/gnupg
            mkdir -p $GNUPGHOME && chmod 700 $GNUPGHOME
            gpg --batch --import /ws/key.gpg
            for arch in amd64 arm64; do
              cd /ws/repo/$arch
              for pkg in charly-*.pkg.tar.zst; do
                # pacman downloads the signature as <pkg>.sig (dload.c appends
                # ".sig" to the URL; there is no .asc fallback) — sign binary,
                # not armored, or the install-test fails on the package sig.
                gpg --batch --yes --pinentry-mode loopback \
                  --passphrase-file <(echo "$GPG_PASSPHRASE") \
                  --detach-sign "$pkg"
              done
              repo-add charly.db.tar.zst charly-*.pkg.tar.zst
              # pacman requests the db signature under the uncompressed name
              # (charly.db.sig), not the .tar.zst name — sign the symlink
              # repo-add created so both names carry a signature.
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file <(echo "$GPG_PASSPHRASE") \
                --detach-sign charly.db
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file <(echo "$GPG_PASSPHRASE") \
                --detach-sign charly.files
            done
          '

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls repo/$arch/charly-*.pkg.tar.zst | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" repo/$arch/charly-$arch.pkg.tar.zst
            cp "$newest.sig" repo/$arch/charly-$arch.pkg.tar.zst.sig 2>/dev/null || true
            cp "$newest.asc" repo/$arch/charly-$arch.pkg.tar.zst.asc 2>/dev/null || true
          done

      - name: Install-test
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" archlinux:latest bash -c '
            set -e
            pacman-key --init
            pacman-key --populate
            pacman-key --add /ws/charly.gpg
            KEYID=$(gpg --show-keys --with-colons /ws/charly.gpg 2>/dev/null | awk -F: "/^pub:/ {print \$5; exit}")
            pacman-key --lsign-key "$KEYID"
            printf "[charly]\nServer = file:///ws/repo/amd64\nSigLevel = Required\n" >> /etc/pacman.conf
            pacman -Sy
            pacman -S --noconfirm charly
            # charly v2026.250.0854+ ships the charly-mcp systemd units. The
            # system-wide /etc/charly/charly.yml was RETIRED (spec#183 + sdk#313):
            # the package intentionally ships NO /etc/charly content, so only the
            # units are asserted here — not a packaged config that no longer exists.
            test -f /usr/lib/systemd/system/charly-mcp.service && test -f /usr/lib/systemd/user/charly-mcp.service || { echo "packaged charly-mcp units missing"; exit 1; }
            # non-autostarting: no post-install enable — is-enabled must be
            # 'disabled', or the no-systemd-manager error in the container
            if command -v systemctl >/dev/null 2>&1; then
              state=$(systemctl is-enabled charly-mcp 2>/dev/null || true)
              case "$state" in
                ""|disabled) ;;
                *) echo "charly-mcp unexpectedly enabled: $state"; exit 1 ;;
              esac
            else
              grep -q '^WantedBy=' /usr/lib/systemd/system/charly-mcp.service || { echo "system unit lacks WantedBy="; exit 1; }
            fi
            # ...and no enable marker (wants symlink) exists
            test ! -e /etc/systemd/system/multi-user.target.wants/charly-mcp.service || { echo "unexpected enable marker present"; exit 1; }
            # the retired packaged config stays retired — a regression that re-adds
            # /etc/charly/charly.yml to the package must fail loudly here.
            test ! -e /etc/charly/charly.yml || { echo "/etc/charly/charly.yml should NOT be shipped (retired by spec#183)"; exit 1; }
            # the MCP server starts on demand (no systemd in the container: run
            # it in the foreground and require it to stay up until the timeout)
            (cd /tmp && timeout 5 charly mcp serve --listen 127.0.0.1:18765 >/dev/null 2>&1) || serve=$?
            test "$serve" -eq 124 || { echo "charly mcp serve exited $serve (expected 124 = ran until timeout)"; exit 1; }
            cd /tmp && charly doctor
          '
          # The minimal variant ships only the 3 core plugins — assert the
          # package installs and the plugin set is exactly that, so a variant
          # whose plugin list drifts from the release fails loudly here.
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" archlinux:latest bash -c '
            set -e
            pacman-key --init
            pacman-key --populate
            pacman-key --add /ws/charly.gpg
            KEYID=$(gpg --show-keys --with-colons /ws/charly.gpg 2>/dev/null | awk -F: "/^pub:/ {print \$5; exit}")
            pacman-key --lsign-key "$KEYID"
            printf "[charly]\nServer = file:///ws/repo/amd64\nSigLevel = Required\n" >> /etc/pacman.conf
            pacman -Sy
            pacman -S --noconfirm charly-minimal
            test "$(charly version)" = "$VERSION" || { echo "version mismatch: $(charly version) != $VERSION"; exit 1; }
            plugins=$(ls /usr/lib/charly/plugins/plugin-* | grep -v "\.providers$" | xargs -n1 basename | sort)
            expected=$(printf "plugin-clean\nplugin-doctor\nplugin-settings")
            test "$plugins" = "$expected" || { echo "unexpected minimal plugin set: $plugins"; exit 1; }
            cd /tmp && charly doctor
          '

      - name: Stage static files
        run: |
          # The upload path is repo/, so the committed landing page, .nojekyll,
          # and public key must be copied in or the site root 404s.
          cp index.html .nojekyll charly.gpg repo/

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy
        uses: actions/deploy-pages@v4
